# /etc/nginx/sites-available/lawnguy.conf
#
# Initial install copies this file as-is. After running install-ssl.sh,
# certbot edits this file to add the SSL listener and HTTP → HTTPS redirect.

upstream lawnguy_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream lawnguy_api {
  server 127.0.0.1:3001;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name lawnguybradford.ca www.lawnguybradford.ca;

  # ACME challenge for certbot — must stay open on :80 even after SSL
  # redirect is added (certbot manages this directory).
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Body size cap for the API
  client_max_body_size 1m;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "interest-cohort=()" always;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml+rss application/atom+xml image/svg+xml;

  # API proxy
  location /api/ {
    proxy_pass http://lawnguy_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  # Next.js
  location / {
    proxy_pass http://lawnguy_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
  }

  # Long cache for Next.js static assets
  location /_next/static/ {
    proxy_pass http://lawnguy_web;
    proxy_set_header Host $host;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
